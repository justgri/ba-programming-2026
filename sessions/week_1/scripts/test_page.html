<!DOCTYPE html>
<html>
<head>
    <title>Cute test page</title>
</head>

<body>

    <h1>Hello, world!</h1>

    <p>This is my first web page.</p>

    <p style="color: blue;">
        This text is blue.
    </p>

    <p style="color: red;">
        This text is red.
    </p>

    Let's write some more.<br>
    I want to make a new line.<br>
    I forgot about line breaks.<br><br>

    <h2>Some basic text formatting</h2>

    <p>
        This is <b>bold</b> text.<br>
        This is <i>italic</i> text.<br>
        This is <u>underlined</u> text.
    </p>

    <h2>A cat</h2>

    <img 
        src="https://placecats.com/300/200"
        alt="A cute cat"
        width="300"
    >

    <h2>A dog</h2>

    <img 
        src="https://placedog.net/400/491?id=12"
        alt="A cute dog"
        width="300"
    >

    <h2>A link</h2>

    <p>
        Visit
        <a href="https://www.wikipedia.org">
            Wikipedia
        </a>
    </p>

</body>
</html>
